<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Din forespørgsel</title>
    <link href="../public/css/css.css" th:href="@{/css/css.css}" rel="stylesheet"/>
</head>
<body>

<div class="header">
    <img src="../public/images/FogLogo.jpeg" th:src="@{/images/FogLogo.jpeg}" height="70" width="70"/>
    <div class="search-bar">
        <input type="text" placeholder="Søg på produkter eller kategorier">
    </div>
    <div class="konto">Fog Konto</div>
</div>

<div class="request-status-container">
    <tr th:each="order : ${orders}">
        <div class="request-header"><h2>Din forespørgsel</h2></div>
        <td class="request-header" th:text="'#'+${order.orderid}"></td>
        <td th:text="${order.user.email}"></td>
        <td th:text="'Ordre indsendt ' +${order.date}"></td>
        <td><button type="submit" class="buttonTable">Se detajler</button></td>
    </tr>


    <div class="request-body">
        <!-- Her kan der evt. komme yderligere information -->
    </div>
</div>


</body>
</html>
