<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carport Designer</title>
    <link href="../public/css/css.css" th:href="@{/css/css.css}" rel="stylesheet"/>
</head>
<body>

<div class="header">
    <img src="../../../../target/Fog.jpeg" height="70" width="70"/>
    <div class="search-bar">
        <input type="text" placeholder="Søg på produkter eller kategorier">
    </div>
    <div class="konto">Fog Konto</div>
</div>

<div class="nav-steps">
    <div>Design</div>
    <div>→</div>
    <div>Login</div>
    <div>→</div>
    <div>Forespørgsel</div>
</div>

<div class="designer-container">
    <div class="options">
        <select>
            <option>Med/uden skur</option>
            <option>Med skur</option>
            <option>Uden skur</option>
        </select>

        <select id="length" name="length">
            <option>Længde i cm</option>
                <option th:each="length : ${lengthOptions}"
                        th:value="${length}"
                        th:text="${length +' cm'}">
                </option>
            </select>
        </select>

        <select id="height" name="height">
            <option>Højde i cm</option>
            <option th:each="height : ${heightOptions}"
                    th:value="${height}"
                    th:text="${height +' cm'}">
            </option>
        </select>

        <select id="width" name="width">
            <option>Bredde i cm</option>
            <option th:each="width : ${widthOptions}"
                    th:value="${width}"
                    th:text="${width +' cm'}">
            </option>
        </select>
        </select>

        <select>
            <option>Håndværker?</option>
            <option>Ja</option>
            <option>Nej</option>
        </select>
    </div>

    <div class="drawing">
        <p>SVG tegning </p>
    </div>

    <div class="info-text">
        <p>Brødtekst er længere, løbende tekst. Før i tiden blev typografernes løn beregnet ud fra antallet af linjer de
            havde sat. Brødteksten var hurtig at sætte og det var hovedsageligt det som gav sætteren penge til det
            daglige brød.</p>
    </div>
</div>


<form method="get">
    <div class="next-button">
        <button class="button" formaction="/loginOpretBruger" type="submit">Videre</button>
        <!-- TIL OpretBrugerEllerLogin.html -->
    </div>
    <form>

</body>
</html>
